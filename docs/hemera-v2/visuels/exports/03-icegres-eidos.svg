<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" data-theme="light" role="img" aria-labelledby="03-icegres-eidos-title 03-icegres-eidos-desc"><title id="03-icegres-eidos-title">Icegres exécute. Eidos donne le sens.</title><desc id="03-icegres-eidos-desc">Les deux projets apportent des briques Rust utiles. Leur intégration passe par des éditions épinglées et le même contrôle de publication que les autres services. Lecture de code locale · Icegres et Eidos n’ont pas été modifiés ou déployés par cette étude.</desc><style>:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--soft:#e9edf4;--ink:#20283c;--muted:#58657c;--line:#ced6e2;--blue:#285cd4;--blue-soft:#eaf0ff;--teal:#087b73;--teal-soft:#e2f5ef;--amber:#a85a0c;--amber-soft:#fff1df;--red:#b7314a;--red-soft:#fde9ef;--purple:#7749c3;--purple-soft:#f1eaff;--shadow:0 14px 35px #172e5510}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}
svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--panel)}
svg .blue{--tone:var(--blue);--wash:var(--blue-soft)}svg .teal{--tone:var(--teal);--wash:var(--teal-soft)}svg .amber{--tone:var(--amber);--wash:var(--amber-soft)}svg .red{--tone:var(--red);--wash:var(--red-soft)}svg .purple{--tone:var(--purple);--wash:var(--purple-soft)}
svg text{fill:var(--ink)}svg .node{cursor:pointer;transition:opacity .18s}svg .node-bg{fill:var(--panel);stroke:var(--line);stroke-width:1.4}svg .accent{fill:var(--tone,var(--blue))}svg .node-title{font-size:18px;font-weight:720;letter-spacing:-.2px}svg .sub{font-size:14px;fill:var(--muted)}svg .tag{font-size:10px;letter-spacing:1px;font-weight:750;fill:var(--tone,var(--blue))}svg .lane{fill:var(--soft);stroke:var(--line);stroke-width:1}svg .lane-title{font-size:15px;font-weight:700;letter-spacing:.25px}svg .edge{fill:none;stroke:var(--tone,var(--blue));stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}svg .annotation{font-size:15px;font-weight:700;fill:var(--tone,var(--muted))}svg .selected .node-bg,svg .node:hover .node-bg{fill:var(--wash,var(--blue-soft));stroke:var(--tone,var(--blue));stroke-width:2.5}svg .node:focus{outline:none}svg .node:focus-visible .node-bg{stroke:var(--amber);stroke-width:4}svg .dim{opacity:.16}svg .large{font-size:44px;font-weight:750;letter-spacing:-1px}svg .rule{stroke:var(--line);stroke-width:1}svg .muted{fill:var(--muted)}svg .small{font-size:12px;fill:var(--muted)}svg .pill{fill:var(--wash,var(--soft));stroke:var(--tone,var(--line));stroke-width:1}svg .dot{fill:var(--tone,var(--blue))}
</style><defs><marker id="03-icegres-eidos-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" style="fill:var(--muted)"/></marker></defs><text x="24" y="32" class="tag">HEMERA V2 · CLEYROP · 2 OCTOBRE 2026</text><text x="24" y="65" class="node-title" style="font-size:27px">Icegres exécute. Eidos donne le sens.</text><text x="24" y="91" class="sub">Les deux projets apportent des briques Rust utiles. Leur intégration passe par des éditions épinglées et le même contrôle de publication</text><text x="24" y="110" class="sub">que les autres services.</text><g transform="translate(0 125)"><rect class="lane" x="20" y="20" width="1160" height="245" rx="16"/><text class="lane-title" x="38" y="47">LECTURE · DU SENS AU RÉSULTAT</text><text class="sub" x="38" y="68">Une requête se fixe sur une version du modèle et des éditions de données</text><rect class="lane" x="20" y="290" width="1160" height="260" rx="16"/><text class="lane-title" x="38" y="317">ACTION · DE L’INTENTION À L’ÉDITION</text><text class="sub" x="38" y="338">Une action peut créer un run ; elle ne devient pas un raccourci vers main</text><rect class="lane" x="20" y="575" width="1160" height="120" rx="16"/><text class="lane-title" x="38" y="602">ADAPTATIONS À LIVRER</text><text class="sub" x="38" y="623">Les composants locaux sont observés ; ces coutures de gouvernance restent à implémenter</text><path data-edge="compile" class="edge teal" d="M280 157 H328" marker-end="url(#03-icegres-eidos-arrow)"/><path data-edge="resolve" class="edge teal" d="M570 157 H618" marker-end="url(#03-icegres-eidos-arrow)"/><path data-edge="execute" class="edge teal" d="M860 157 H908" marker-end="url(#03-icegres-eidos-arrow)"/><path data-edge="plan" class="edge blue" d="M280 427 H328" marker-end="url(#03-icegres-eidos-arrow)"/><path data-edge="run" class="edge blue" d="M570 427 H618" marker-end="url(#03-icegres-eidos-arrow)"/><path data-edge="publish" class="edge blue" d="M860 427 H908" marker-end="url(#03-icegres-eidos-arrow)"/><g class="node teal"><rect class="node-bg" x="45" y="108" width="235" height="105" rx="12"/><rect class="accent" x="45" y="122" width="4" height="77" rx="2"/><text class="tag" x="63" y="127">BASE LOCALE</text><text class="node-title" x="63" y="150">Eidos</text><text class="sub" x="63" y="171">Modèle + requête typée</text></g><g class="node blue"><rect class="node-bg" x="335" y="108" width="235" height="105" rx="12"/><rect class="accent" x="335" y="122" width="4" height="77" rx="2"/><text class="tag" x="353" y="127">À CONSTRUIRE</text><text class="node-title" x="353" y="150">Resolver</text><text class="sub" x="353" y="171">Identité + InputPins</text></g><g class="node teal"><rect class="node-bg" x="625" y="108" width="235" height="105" rx="12"/><rect class="accent" x="625" y="122" width="4" height="77" rx="2"/><text class="tag" x="643" y="127">BASE LOCALE</text><text class="node-title" x="643" y="150">Icegres</text><text class="sub" x="643" y="171">SQL / DataFusion / Arrow</text></g><g class="node blue"><rect class="node-bg" x="915" y="108" width="235" height="105" rx="12"/><rect class="accent" x="915" y="122" width="4" height="77" rx="2"/><text class="tag" x="933" y="127">CIBLE</text><text class="node-title" x="933" y="150">Résultat gouverné</text><text class="sub" x="933" y="171">Éditions et modèle connus</text></g><g class="node teal"><rect class="node-bg" x="45" y="378" width="235" height="105" rx="12"/><rect class="accent" x="45" y="392" width="4" height="77" rx="2"/><text class="tag" x="63" y="397">BASE À ADAPTER</text><text class="node-title" x="63" y="420">Eidos ActionPlan</text><text class="sub" x="63" y="441">Intention, droits, idempotence</text></g><g class="node blue"><rect class="node-bg" x="335" y="378" width="235" height="105" rx="12"/><rect class="accent" x="335" y="392" width="4" height="77" rx="2"/><text class="tag" x="353" y="397">CIBLE</text><text class="node-title" x="353" y="420">Flows</text><text class="sub" x="353" y="441">Run borné + worker privé</text></g><g class="node blue"><rect class="node-bg" x="625" y="378" width="235" height="105" rx="12"/><rect class="accent" x="625" y="392" width="4" height="77" rx="2"/><text class="tag" x="643" y="397">CIBLE</text><text class="node-title" x="643" y="420">Writer + audits</text><text class="sub" x="643" y="441">Candidat exact, preuve liée</text></g><g class="node blue"><rect class="node-bg" x="915" y="378" width="235" height="105" rx="12"/><rect class="accent" x="915" y="392" width="4" height="77" rx="2"/><text class="tag" x="933" y="397">CIBLE</text><text class="node-title" x="933" y="420">Publisher</text><text class="sub" x="933" y="441">CAS → édition → ack</text></g><text class="annotation amber" x="45" y="657">Eidos : authority + actions</text><text class="sub" x="45" y="678">Actif PostgreSQL / latest → pins d’édition</text><text class="annotation amber" x="445" y="657">Icegres : query + write</text><text class="sub" x="445" y="678">Direct sync / buffer → PreparedWrite</text><text class="annotation amber" x="825" y="657">Contrats communs</text><text class="sub" x="825" y="678">Politique · reçu · annulation</text></g><text x="24" y="868" class="small">Lecture de code locale · Icegres et Eidos n’ont pas été modifiés ou déployés par cette étude.</text></svg>