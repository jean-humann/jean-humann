<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" data-theme="light" role="img" aria-labelledby="06-kinds-provenance-title 06-kinds-provenance-desc"><title id="06-kinds-provenance-title">Huit types de datasets, une autorité d’édition</title><desc id="06-kinds-provenance-desc">Tables, fichiers, modèles et index suivent le même principe de publication. L’export est un effet externe qui consomme une édition ; il n’ajoute pas un neuvième dataset. Taxonomie cible : 8 kinds de datasets ; EXPORT est un effet, EXPOSURE déclare un consommateur. SOURCE, OP et TEST décrivent le flow.</desc><style>:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--soft:#e9edf4;--ink:#20283c;--muted:#58657c;--line:#ced6e2;--blue:#285cd4;--blue-soft:#eaf0ff;--teal:#087b73;--teal-soft:#e2f5ef;--amber:#a85a0c;--amber-soft:#fff1df;--red:#b7314a;--red-soft:#fde9ef;--purple:#7749c3;--purple-soft:#f1eaff;--shadow:0 14px 35px #172e5510}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}
svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--panel)}
svg .blue{--tone:var(--blue);--wash:var(--blue-soft)}svg .teal{--tone:var(--teal);--wash:var(--teal-soft)}svg .amber{--tone:var(--amber);--wash:var(--amber-soft)}svg .red{--tone:var(--red);--wash:var(--red-soft)}svg .purple{--tone:var(--purple);--wash:var(--purple-soft)}
svg text{fill:var(--ink)}svg .node{cursor:pointer;transition:opacity .18s}svg .node-bg{fill:var(--panel);stroke:var(--line);stroke-width:1.4}svg .accent{fill:var(--tone,var(--blue))}svg .node-title{font-size:18px;font-weight:720;letter-spacing:-.2px}svg .sub{font-size:14px;fill:var(--muted)}svg .tag{font-size:10px;letter-spacing:1px;font-weight:750;fill:var(--tone,var(--blue))}svg .lane{fill:var(--soft);stroke:var(--line);stroke-width:1}svg .lane-title{font-size:15px;font-weight:700;letter-spacing:.25px}svg .edge{fill:none;stroke:var(--tone,var(--blue));stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}svg .annotation{font-size:15px;font-weight:700;fill:var(--tone,var(--muted))}svg .selected .node-bg,svg .node:hover .node-bg{fill:var(--wash,var(--blue-soft));stroke:var(--tone,var(--blue));stroke-width:2.5}svg .node:focus{outline:none}svg .node:focus-visible .node-bg{stroke:var(--amber);stroke-width:4}svg .dim{opacity:.16}svg .large{font-size:44px;font-weight:750;letter-spacing:-1px}svg .rule{stroke:var(--line);stroke-width:1}svg .muted{fill:var(--muted)}svg .small{font-size:12px;fill:var(--muted)}svg .pill{fill:var(--wash,var(--soft));stroke:var(--tone,var(--line));stroke-width:1}svg .dot{fill:var(--tone,var(--blue))}
</style><defs><marker id="06-kinds-provenance-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" style="fill:var(--muted)"/></marker></defs><text x="24" y="32" class="tag">HEMERA V2 · CLEYROP · 2 OCTOBRE 2026</text><text x="24" y="65" class="node-title" style="font-size:27px">Huit types de datasets, une autorité d’édition</text><text x="24" y="91" class="sub">Tables, fichiers, modèles et index suivent le même principe de publication. L’export est un effet externe qui consomme une édition ; il</text><text x="24" y="110" class="sub">n’ajoute pas un neuvième dataset.</text><g transform="translate(0 125)"><rect class="lane" x="20" y="20" width="1160" height="170" rx="16"/><text class="lane-title" x="38" y="47">DONNÉES TABULAIRES</text><text class="sub" x="38" y="68">Le snapshot publié porte les données et leur provenance</text><rect class="lane" x="20" y="215" width="1160" height="170" rx="16"/><text class="lane-title" x="38" y="242">DÉFINITIONS ET ARTEFACTS</text><text class="sub" x="38" y="263">Le snapshot peut publier un manifeste plutôt que les octets de l’artefact</text><rect class="lane" x="20" y="410" width="1160" height="170" rx="16"/><text class="lane-title" x="38" y="437">DÉRIVÉS POUR L’USAGE</text><text class="sub" x="38" y="458">Les index et stores sont des projections d’une édition autoritaire</text><rect class="lane" x="20" y="605" width="1160" height="130" rx="16"/><text class="lane-title" x="38" y="632">EFFETS EXTERNES</text><text class="sub" x="38" y="653">Une autre forme de reprise : journal d’effets, idempotence et réconciliation</text><g class="node blue"><rect class="node-bg" x="45" y="92" width="350" height="75" rx="12"/><rect class="accent" x="45" y="106" width="4" height="47" rx="2"/><text class="tag" x="63" y="111">CIBLE</text><text class="node-title" x="63" y="134">TABLE</text><text class="sub" x="63" y="155">Résultat tabulaire</text></g><g class="node blue"><rect class="node-bg" x="425" y="92" width="350" height="75" rx="12"/><rect class="accent" x="425" y="106" width="4" height="47" rx="2"/><text class="tag" x="443" y="111">CIBLE</text><text class="node-title" x="443" y="134">INCREMENTAL</text><text class="sub" x="443" y="155">Évolution incrémentale</text></g><g class="node blue"><rect class="node-bg" x="805" y="92" width="350" height="75" rx="12"/><rect class="accent" x="805" y="106" width="4" height="47" rx="2"/><text class="tag" x="823" y="111">CIBLE</text><text class="node-title" x="823" y="134">STREAM</text><text class="sub" x="823" y="155">Raw publié par lots bornés</text></g><g class="node blue"><rect class="node-bg" x="45" y="287" width="350" height="75" rx="12"/><rect class="accent" x="45" y="301" width="4" height="47" rx="2"/><text class="tag" x="63" y="306">CIBLE</text><text class="node-title" x="63" y="329">VIEW</text><text class="sub" x="63" y="350">Définition versionnée</text></g><g class="node blue"><rect class="node-bg" x="425" y="287" width="350" height="75" rx="12"/><rect class="accent" x="425" y="301" width="4" height="47" rx="2"/><text class="tag" x="443" y="306">CIBLE</text><text class="node-title" x="443" y="329">FILESET</text><text class="sub" x="443" y="350">Manifeste + objets privés</text></g><g class="node blue"><rect class="node-bg" x="805" y="287" width="350" height="75" rx="12"/><rect class="accent" x="805" y="301" width="4" height="47" rx="2"/><text class="tag" x="823" y="306">CIBLE</text><text class="node-title" x="823" y="329">MODEL</text><text class="sub" x="823" y="350">Manifeste + artefacts</text></g><g class="node blue"><rect class="node-bg" x="45" y="482" width="350" height="75" rx="12"/><rect class="accent" x="45" y="496" width="4" height="47" rx="2"/><text class="tag" x="63" y="501">CIBLE</text><text class="node-title" x="63" y="524">EMBEDDINGS</text><text class="sub" x="63" y="545">Édition source → index</text></g><g class="node blue"><rect class="node-bg" x="425" y="482" width="350" height="75" rx="12"/><rect class="accent" x="425" y="496" width="4" height="47" rx="2"/><text class="tag" x="443" y="501">CIBLE</text><text class="node-title" x="443" y="524">FEATURESET</text><text class="sub" x="443" y="545">Offline → store en ligne</text></g><text class="annotation amber" x="825" y="516">SOURCE · OP · TEST</text><text class="sub" x="825" y="537">Nœuds de flow, pas des kinds</text><g class="node amber"><rect class="node-bg" x="45" y="657" width="1110" height="72" rx="12"/><rect class="accent" x="45" y="671" width="4" height="44" rx="2"/><text class="tag" x="63" y="676">EFFET</text><text class="node-title" x="63" y="699">EXPORT</text><text class="sub" x="63" y="720">Édition consommée → livraison externe + reçu</text></g></g><text x="24" y="908" class="small">Taxonomie cible : 8 kinds de datasets ; EXPORT est un effet, EXPOSURE déclare un consommateur. SOURCE, OP et TEST décrivent le flow.</text></svg>