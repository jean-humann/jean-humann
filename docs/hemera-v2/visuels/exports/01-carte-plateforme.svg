<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" data-theme="light" role="img" aria-labelledby="01-carte-plateforme-title 01-carte-plateforme-desc"><title id="01-carte-plateforme-title">Une plateforme, une frontière de publication</title><desc id="01-carte-plateforme-desc">Les services Rust organisent le travail. L’édition Iceberg publiée fixe ce que les utilisateurs peuvent lire et ce que les sources peuvent acquitter. Architecture cible proposée · Chaque flèche représente un contrat, pas une intégration déjà livrée.</desc><style>:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--soft:#e9edf4;--ink:#20283c;--muted:#58657c;--line:#ced6e2;--blue:#285cd4;--blue-soft:#eaf0ff;--teal:#087b73;--teal-soft:#e2f5ef;--amber:#a85a0c;--amber-soft:#fff1df;--red:#b7314a;--red-soft:#fde9ef;--purple:#7749c3;--purple-soft:#f1eaff;--shadow:0 14px 35px #172e5510}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}
svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--panel)}
svg .blue{--tone:var(--blue);--wash:var(--blue-soft)}svg .teal{--tone:var(--teal);--wash:var(--teal-soft)}svg .amber{--tone:var(--amber);--wash:var(--amber-soft)}svg .red{--tone:var(--red);--wash:var(--red-soft)}svg .purple{--tone:var(--purple);--wash:var(--purple-soft)}
svg text{fill:var(--ink)}svg .node{cursor:pointer;transition:opacity .18s}svg .node-bg{fill:var(--panel);stroke:var(--line);stroke-width:1.4}svg .accent{fill:var(--tone,var(--blue))}svg .node-title{font-size:18px;font-weight:720;letter-spacing:-.2px}svg .sub{font-size:14px;fill:var(--muted)}svg .tag{font-size:10px;letter-spacing:1px;font-weight:750;fill:var(--tone,var(--blue))}svg .lane{fill:var(--soft);stroke:var(--line);stroke-width:1}svg .lane-title{font-size:15px;font-weight:700;letter-spacing:.25px}svg .edge{fill:none;stroke:var(--tone,var(--blue));stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}svg .annotation{font-size:15px;font-weight:700;fill:var(--tone,var(--muted))}svg .selected .node-bg,svg .node:hover .node-bg{fill:var(--wash,var(--blue-soft));stroke:var(--tone,var(--blue));stroke-width:2.5}svg .node:focus{outline:none}svg .node:focus-visible .node-bg{stroke:var(--amber);stroke-width:4}svg .dim{opacity:.16}svg .large{font-size:44px;font-weight:750;letter-spacing:-1px}svg .rule{stroke:var(--line);stroke-width:1}svg .muted{fill:var(--muted)}svg .small{font-size:12px;fill:var(--muted)}svg .pill{fill:var(--wash,var(--soft));stroke:var(--tone,var(--line));stroke-width:1}svg .dot{fill:var(--tone,var(--blue))}
</style><defs><marker id="01-carte-plateforme-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" style="fill:var(--muted)"/></marker></defs><text x="24" y="32" class="tag">HEMERA V2 · CLEYROP · 2 OCTOBRE 2026</text><text x="24" y="65" class="node-title" style="font-size:27px">Une plateforme, une frontière de publication</text><text x="24" y="91" class="sub">Les services Rust organisent le travail. L’édition Iceberg publiée fixe ce que les utilisateurs peuvent lire et ce que les sources</text><text x="24" y="110" class="sub">peuvent acquitter.</text><g transform="translate(0 125)"><rect class="lane" x="20" y="20" width="1160" height="145" rx="16"/><text class="lane-title" x="38" y="47">ACCÈS PRODUIT</text><text class="sub" x="38" y="68">Des façades compatibles pour les utilisateurs et les outils</text><rect class="lane" x="20" y="190" width="365" height="470" rx="16"/><text class="lane-title" x="38" y="217">CONTRÔLE · SERVICES RUST</text><text class="sub" x="38" y="238">Identité, intention et exécution bornée</text><rect class="lane" x="410" y="190" width="365" height="470" rx="16"/><text class="lane-title" x="428" y="217">DONNÉES · EXÉCUTANTS</text><text class="sub" x="428" y="238">Fichiers privés, requêtes et index dérivés</text><rect class="lane" x="800" y="190" width="380" height="470" rx="16"/><text class="lane-title" x="818" y="217">PUBLICATION · SERVICES DE CONFIANCE</text><text class="sub" x="818" y="238">Un passage obligatoire vers l’édition</text><path data-edge="client-control" class="edge blue" d="M190 148 V178 H37 V320 H51" marker-end="url(#01-carte-plateforme-arrow)"/><path data-edge="client-query" class="edge teal" d="M605 148 V178 H786 V517 H744" marker-end="url(#01-carte-plateforme-arrow)"/><path data-edge="schedule" class="edge blue" d="M350 442 H397 V322 H439" marker-end="url(#01-carte-plateforme-arrow)"/><path data-edge="prepare" class="edge blue" d="M740 321 H833" marker-end="url(#01-carte-plateforme-arrow)"/><path data-edge="iam-flow" class="edge blue" d="M200 365 V391" marker-end="url(#01-carte-plateforme-arrow)"/><path data-edge="eidos-flow" class="edge purple" d="M200 520 V494" marker-end="url(#01-carte-plateforme-arrow)"/><path data-edge="audit" class="edge blue" d="M995 366 V470" marker-end="url(#01-carte-plateforme-arrow)"/><path data-edge="commit" class="edge blue" d="M995 560 V685" marker-end="url(#01-carte-plateforme-arrow)"/><path data-edge="read" class="edge teal" d="M605 560 V685" marker-end="url(#01-carte-plateforme-arrow)"/><g class="node blue"><rect class="node-bg" x="55" y="78" width="1070" height="70" rx="12"/><rect class="accent" x="55" y="92" width="4" height="42" rx="2"/><text class="tag" x="73" y="97">CONTRATS STABLES</text><text class="node-title" x="73" y="120">UI · SDK · SQL · MCP</text><text class="sub" x="73" y="141">Interfaces TypeScript et Python</text></g><g class="node blue"><rect class="node-bg" x="55" y="270" width="295" height="95" rx="12"/><rect class="accent" x="55" y="284" width="4" height="67" rx="2"/><text class="tag" x="73" y="289">CIBLE</text><text class="node-title" x="73" y="312">IAM + Catalog</text><text class="sub" x="73" y="333">Droits, discovery, projections</text></g><g class="node blue"><rect class="node-bg" x="55" y="395" width="295" height="95" rx="12"/><rect class="accent" x="55" y="409" width="4" height="67" rx="2"/><text class="tag" x="73" y="414">CIBLE</text><text class="node-title" x="73" y="437">Flows + Datasets</text><text class="sub" x="73" y="458">Manifestes, runs, contrats</text></g><g class="node blue"><rect class="node-bg" x="55" y="520" width="295" height="95" rx="12"/><rect class="accent" x="55" y="534" width="4" height="67" rx="2"/><text class="tag" x="73" y="539">CIBLE</text><text class="node-title" x="73" y="562">Eidos + Runtimes</text><text class="sub" x="73" y="583">Sémantique, actions, placement</text></g><g class="node blue"><rect class="node-bg" x="445" y="275" width="295" height="95" rx="12"/><rect class="accent" x="445" y="289" width="4" height="67" rx="2"/><text class="tag" x="463" y="294">CIBLE</text><text class="node-title" x="463" y="317">Workers bornés</text><text class="sub" x="463" y="338">Écriture de fichiers privés</text></g><g class="node blue"><rect class="node-bg" x="445" y="470" width="295" height="95" rx="12"/><rect class="accent" x="445" y="484" width="4" height="67" rx="2"/><text class="tag" x="463" y="489">CIBLE</text><text class="node-title" x="463" y="512">Icegres + Files</text><text class="sub" x="463" y="533">Lecture d’éditions autorisées</text></g><g class="node blue"><rect class="node-bg" x="835" y="275" width="310" height="95" rx="12"/><rect class="accent" x="835" y="289" width="4" height="67" rx="2"/><text class="tag" x="853" y="294">CIBLE</text><text class="node-title" x="853" y="317">Writer Rust</text><text class="sub" x="853" y="338">Commit staging contrôlé</text></g><g class="node blue"><rect class="node-bg" x="835" y="470" width="310" height="95" rx="12"/><rect class="accent" x="835" y="484" width="4" height="67" rx="2"/><text class="tag" x="853" y="489">CIBLE</text><text class="node-title" x="853" y="512">Audits + Publisher</text><text class="sub" x="853" y="533">Preuve, CAS, reçu, puis ack</text></g><text class="annotation red" x="455" y="407">Pas de credential table.modify</text><text class="sub" x="455" y="428">dans un worker générique</text><rect class="lane" x="20" y="683" width="1160" height="76" rx="16"/><text class="lane-title" x="38" y="710">FONDATIONS</text><text class="sub" x="38" y="731">Lakekeeper · OpenFGA · Iceberg / objets privés · PostgreSQL · journal durable</text></g><text x="24" y="928" class="small">Architecture cible proposée · Chaque flèche représente un contrat, pas une intégration déjà livrée.</text></svg>