<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" data-theme="dark" role="img" aria-labelledby="05-securite-frontieres-title 05-securite-frontieres-desc"><title id="05-securite-frontieres-title">WAP protège la visibilité. Il faut aussi protéger les octets.</title><desc id="05-securite-frontieres-desc">Le banc a montré qu’un lecteur autorisé sur une table pouvait atteindre les fichiers d’un candidat non publié, même après retrait de sa branche. La cible doit contrôler l’accès à une édition et à tous ses objets. Rouge : comportement reproduit dans le banc local · Bleu : frontière proposée, encore à qualifier.</desc><style>:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--soft:#e9edf4;--ink:#20283c;--muted:#58657c;--line:#ced6e2;--blue:#285cd4;--blue-soft:#eaf0ff;--teal:#087b73;--teal-soft:#e2f5ef;--amber:#a85a0c;--amber-soft:#fff1df;--red:#b7314a;--red-soft:#fde9ef;--purple:#7749c3;--purple-soft:#f1eaff;--shadow:0 14px 35px #172e5510}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}
svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--panel)}
svg .blue{--tone:var(--blue);--wash:var(--blue-soft)}svg .teal{--tone:var(--teal);--wash:var(--teal-soft)}svg .amber{--tone:var(--amber);--wash:var(--amber-soft)}svg .red{--tone:var(--red);--wash:var(--red-soft)}svg .purple{--tone:var(--purple);--wash:var(--purple-soft)}
svg text{fill:var(--ink)}svg .node{cursor:pointer;transition:opacity .18s}svg .node-bg{fill:var(--panel);stroke:var(--line);stroke-width:1.4}svg .accent{fill:var(--tone,var(--blue))}svg .node-title{font-size:18px;font-weight:720;letter-spacing:-.2px}svg .sub{font-size:14px;fill:var(--muted)}svg .tag{font-size:10px;letter-spacing:1px;font-weight:750;fill:var(--tone,var(--blue))}svg .lane{fill:var(--soft);stroke:var(--line);stroke-width:1}svg .lane-title{font-size:15px;font-weight:700;letter-spacing:.25px}svg .edge{fill:none;stroke:var(--tone,var(--blue));stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}svg .annotation{font-size:15px;font-weight:700;fill:var(--tone,var(--muted))}svg .selected .node-bg,svg .node:hover .node-bg{fill:var(--wash,var(--blue-soft));stroke:var(--tone,var(--blue));stroke-width:2.5}svg .node:focus{outline:none}svg .node:focus-visible .node-bg{stroke:var(--amber);stroke-width:4}svg .dim{opacity:.16}svg .large{font-size:44px;font-weight:750;letter-spacing:-1px}svg .rule{stroke:var(--line);stroke-width:1}svg .muted{fill:var(--muted)}svg .small{font-size:12px;fill:var(--muted)}svg .pill{fill:var(--wash,var(--soft));stroke:var(--tone,var(--line));stroke-width:1}svg .dot{fill:var(--tone,var(--blue))}
</style><defs><marker id="05-securite-frontieres-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" style="fill:var(--muted)"/></marker></defs><text x="24" y="32" class="tag">HEMERA V2 · CLEYROP · 2 OCTOBRE 2026</text><text x="24" y="65" class="node-title" style="font-size:27px">WAP protège la visibilité. Il faut aussi protéger les octets.</text><text x="24" y="91" class="sub">Le banc a montré qu’un lecteur autorisé sur une table pouvait atteindre les fichiers d’un candidat non publié, même après retrait de sa</text><text x="24" y="110" class="sub">branche. La cible doit contrôler l’accès à une édition et à tous ses objets.</text><g transform="translate(0 125)"><rect class="lane" x="20" y="20" width="555" height="535" rx="16"/><text class="lane-title" x="38" y="47">CHEMIN REPRODUIT DANS LE BANC</text><text class="sub" x="38" y="68">Main reste intact ; la confidentialité staging échoue</text><rect class="lane" x="600" y="20" width="580" height="535" rx="16"/><text class="lane-title" x="618" y="47">CHEMIN CIBLE À QUALIFIER</text><text class="sub" x="618" y="68">Identité + édition + fermeture de fichiers autorisés</text><path data-edge="leak1" class="edge red" d="M295 186 V233" marker-end="url(#05-securite-frontieres-arrow)"/><path data-edge="leak2" class="edge red" d="M295 341 V388" marker-end="url(#05-securite-frontieres-arrow)"/><path data-edge="safe1" class="edge blue" d="M890 186 V233" marker-end="url(#05-securite-frontieres-arrow)"/><path data-edge="safe2" class="edge blue" d="M890 341 V388" marker-end="url(#05-securite-frontieres-arrow)"/><g class="node red"><rect class="node-bg" x="55" y="88" width="485" height="105" rx="12"/><rect class="accent" x="55" y="102" width="4" height="77" rx="2"/><text class="tag" x="73" y="107">OBSERVÉ</text><text class="node-title" x="73" y="130">Lecteur : table.select</text><text class="sub" x="73" y="151">Autorisation au niveau de la table</text></g><g class="node red"><rect class="node-bg" x="55" y="238" width="485" height="105" rx="12"/><rect class="accent" x="55" y="252" width="4" height="77" rx="2"/><text class="tag" x="73" y="257">OBSERVÉ</text><text class="node-title" x="73" y="280">Métadonnées + signer</text><text class="sub" x="73" y="301">Le snapshot staging reste découvrable</text></g><g class="node red"><rect class="node-bg" x="55" y="395" width="485" height="105" rx="12"/><rect class="accent" x="55" y="409" width="4" height="77" rx="2"/><text class="tag" x="73" y="414">ÉCHEC REPRODUIT</text><text class="node-title" x="73" y="437">GET des objets non publiés</text><text class="sub" x="73" y="458">Accès aussi après retrait de la branche</text></g><g class="node blue"><rect class="node-bg" x="635" y="88" width="505" height="105" rx="12"/><rect class="accent" x="635" y="102" width="4" height="77" rx="2"/><text class="tag" x="653" y="107">CIBLE</text><text class="node-title" x="653" y="130">Identité et politique</text><text class="sub" x="653" y="151">Utilisateur, tenant, édition demandée</text></g><g class="node blue"><rect class="node-bg" x="635" y="238" width="505" height="105" rx="12"/><rect class="accent" x="635" y="252" width="4" height="77" rx="2"/><text class="tag" x="653" y="257">CIBLE</text><text class="node-title" x="653" y="280">Service de lecture / PEP</text><text class="sub" x="653" y="301">Vérifie édition et fermeture d’objets</text></g><g class="node blue"><rect class="node-bg" x="635" y="395" width="505" height="105" rx="12"/><rect class="accent" x="635" y="409" width="4" height="77" rx="2"/><text class="tag" x="653" y="414">CIBLE</text><text class="node-title" x="653" y="437">Accès objets limité</text><text class="sub" x="653" y="458">Données, manifests, deletes, statistiques</text></g><g class="node amber"><rect class="node-bg" x="45" y="590" width="1110" height="105" rx="12"/><rect class="accent" x="45" y="604" width="4" height="77" rx="2"/><text class="tag" x="63" y="609">CONTRAINTE DU MODÈLE NATIF</text><text class="node-title" x="63" y="632">Autre frontière : le droit de commit</text><text class="sub" x="63" y="653">table.modify permet aussi can_commit et can_drop. Un worker générique ne doit pas le recevoir.</text></g></g><text x="24" y="868" class="small">Rouge : comportement reproduit dans le banc local · Bleu : frontière proposée, encore à qualifier.</text></svg>