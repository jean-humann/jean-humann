<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" data-theme="dark" role="img" aria-labelledby="02-avant-cible-title 02-avant-cible-desc"><title id="02-avant-cible-title">Retirer la JVM sans perdre les usages</title><desc id="02-avant-cible-desc">La migration porte sur les services métier, les moteurs, l’identité et l’exploitation. Le changement de langage ne suffit pas à préserver les contrats. Inventaire ≠ cible déployée · Les candidats IdP, journal et calcul distribué ne sont pas qualifiés dans cette étude.</desc><style>:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--soft:#e9edf4;--ink:#20283c;--muted:#58657c;--line:#ced6e2;--blue:#285cd4;--blue-soft:#eaf0ff;--teal:#087b73;--teal-soft:#e2f5ef;--amber:#a85a0c;--amber-soft:#fff1df;--red:#b7314a;--red-soft:#fde9ef;--purple:#7749c3;--purple-soft:#f1eaff;--shadow:0 14px 35px #172e5510}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}
svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--panel)}
svg .blue{--tone:var(--blue);--wash:var(--blue-soft)}svg .teal{--tone:var(--teal);--wash:var(--teal-soft)}svg .amber{--tone:var(--amber);--wash:var(--amber-soft)}svg .red{--tone:var(--red);--wash:var(--red-soft)}svg .purple{--tone:var(--purple);--wash:var(--purple-soft)}
svg text{fill:var(--ink)}svg .node{cursor:pointer;transition:opacity .18s}svg .node-bg{fill:var(--panel);stroke:var(--line);stroke-width:1.4}svg .accent{fill:var(--tone,var(--blue))}svg .node-title{font-size:18px;font-weight:720;letter-spacing:-.2px}svg .sub{font-size:14px;fill:var(--muted)}svg .tag{font-size:10px;letter-spacing:1px;font-weight:750;fill:var(--tone,var(--blue))}svg .lane{fill:var(--soft);stroke:var(--line);stroke-width:1}svg .lane-title{font-size:15px;font-weight:700;letter-spacing:.25px}svg .edge{fill:none;stroke:var(--tone,var(--blue));stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}svg .annotation{font-size:15px;font-weight:700;fill:var(--tone,var(--muted))}svg .selected .node-bg,svg .node:hover .node-bg{fill:var(--wash,var(--blue-soft));stroke:var(--tone,var(--blue));stroke-width:2.5}svg .node:focus{outline:none}svg .node:focus-visible .node-bg{stroke:var(--amber);stroke-width:4}svg .dim{opacity:.16}svg .large{font-size:44px;font-weight:750;letter-spacing:-1px}svg .rule{stroke:var(--line);stroke-width:1}svg .muted{fill:var(--muted)}svg .small{font-size:12px;fill:var(--muted)}svg .pill{fill:var(--wash,var(--soft));stroke:var(--tone,var(--line));stroke-width:1}svg .dot{fill:var(--tone,var(--blue))}
</style><defs><marker id="02-avant-cible-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" style="fill:var(--muted)"/></marker></defs><text x="24" y="32" class="tag">HEMERA V2 · CLEYROP · 2 OCTOBRE 2026</text><text x="24" y="65" class="node-title" style="font-size:27px">Retirer la JVM sans perdre les usages</text><text x="24" y="91" class="sub">La migration porte sur les services métier, les moteurs, l’identité et l’exploitation. Le changement de langage ne suffit pas à</text><text x="24" y="110" class="sub">préserver les contrats.</text><g transform="translate(0 125)"><rect class="lane" x="20" y="20" width="420" height="660" rx="16"/><text class="lane-title" x="38" y="47">EXISTANT OBSERVÉ</text><text class="sub" x="38" y="68">Inventaire local Cleyrop et laboratoire de référence</text><rect class="lane" x="510" y="20" width="670" height="660" rx="16"/><text class="lane-title" x="528" y="47">CIBLE ET DÉCISIONS</text><text class="sub" x="528" y="68">Cores métier Rust ; exécutants spécialisés encapsulés</text><path data-edge="services" class="edge blue" d="M414 148 H538" marker-end="url(#02-avant-cible-arrow)"/><path data-edge="engine" class="edge blue" d="M414 286 H538" marker-end="url(#02-avant-cible-arrow)"/><path data-edge="identity" class="edge blue" d="M414 428 H538" marker-end="url(#02-avant-cible-arrow)"/><path data-edge="operations" class="edge blue" d="M414 573 H538" marker-end="url(#02-avant-cible-arrow)"/><g class="node teal"><rect class="node-bg" x="45" y="90" width="370" height="108" rx="12"/><rect class="accent" x="45" y="104" width="4" height="80" rx="2"/><text class="tag" x="63" y="109">OBSERVÉ</text><text class="node-title" x="63" y="132">6 services Kotlin / Spring</text><text class="sub" x="63" y="153">Collect, Dev, Model, Serve,</text><text class="sub" x="63" y="171">Process, Notification</text></g><g class="node teal"><rect class="node-bg" x="45" y="232" width="370" height="108" rx="12"/><rect class="accent" x="45" y="246" width="4" height="80" rx="2"/><text class="tag" x="63" y="251">OBSERVÉ</text><text class="node-title" x="63" y="274">Spark · Trino · OLake Java</text><text class="sub" x="63" y="295">Calcul, requêtes, writer</text></g><g class="node teal"><rect class="node-bg" x="45" y="374" width="370" height="108" rx="12"/><rect class="accent" x="45" y="388" width="4" height="80" rx="2"/><text class="tag" x="63" y="393">OBSERVÉ</text><text class="node-title" x="63" y="416">Keycloak · Kafka / Strimzi</text><text class="sub" x="63" y="437">Identité et transport</text></g><g class="node teal"><rect class="node-bg" x="45" y="516" width="370" height="108" rx="12"/><rect class="accent" x="45" y="530" width="4" height="80" rx="2"/><text class="tag" x="63" y="535">À INVENTORIER COMPLÈTEMENT</text><text class="node-title" x="63" y="558">JVM dans les dépendances</text><text class="sub" x="63" y="579">Builds, images, maintenance, notebooks</text></g><g class="node blue"><rect class="node-bg" x="540" y="90" width="605" height="108" rx="12"/><rect class="accent" x="540" y="104" width="4" height="80" rx="2"/><text class="tag" x="558" y="109">DÉCISION</text><text class="node-title" x="558" y="132">Services produit Rust</text><text class="sub" x="558" y="153">Contrôle + données, domaines regroupés</text></g><g class="node blue"><rect class="node-bg" x="540" y="232" width="605" height="108" rx="12"/><rect class="accent" x="540" y="246" width="4" height="80" rx="2"/><text class="tag" x="558" y="251">CIBLE / GATE</text><text class="node-title" x="558" y="274">Icegres + writer Rust</text><text class="sub" x="558" y="295">Calcul distribué : qualification ouverte</text></g><g class="node amber"><rect class="node-bg" x="540" y="374" width="605" height="108" rx="12"/><rect class="accent" x="540" y="388" width="4" height="80" rx="2"/><text class="tag" x="558" y="393">CANDIDATS</text><text class="node-title" x="558" y="416">IdP et journal sans JVM</text><text class="sub" x="558" y="437">ZITADEL / JetStream : candidats à qualifier</text></g><g class="node blue"><rect class="node-bg" x="540" y="516" width="605" height="108" rx="12"/><rect class="accent" x="540" y="530" width="4" height="80" rx="2"/><text class="tag" x="558" y="535">CRITÈRE DE SORTIE</text><text class="node-title" x="558" y="558">Installation sans JVM</text><text class="sub" x="558" y="579">Runtime + CI + maintenance + reprise</text></g></g><text x="24" y="868" class="small">Inventaire ≠ cible déployée · Les candidats IdP, journal et calcul distribué ne sont pas qualifiés dans cette étude.</text></svg>