<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 890" data-theme="light" role="img" aria-labelledby="04-edition-publish-ack-title 04-edition-publish-ack-desc"><title id="04-edition-publish-ack-title">Une édition avant chaque acquittement</title><desc id="04-edition-publish-ack-desc">Le moment décisif est la publication conditionnelle. Un veto, un conflit ou une réponse perdue ne doivent jamais être interprétés comme une autorisation d’acquitter. Simulation pédagogique du contrat cible · Ces animations ne sont pas des résultats de tests.</desc><style>:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--soft:#e9edf4;--ink:#20283c;--muted:#58657c;--line:#ced6e2;--blue:#285cd4;--blue-soft:#eaf0ff;--teal:#087b73;--teal-soft:#e2f5ef;--amber:#a85a0c;--amber-soft:#fff1df;--red:#b7314a;--red-soft:#fde9ef;--purple:#7749c3;--purple-soft:#f1eaff;--shadow:0 14px 35px #172e5510}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}
svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--panel)}
svg .blue{--tone:var(--blue);--wash:var(--blue-soft)}svg .teal{--tone:var(--teal);--wash:var(--teal-soft)}svg .amber{--tone:var(--amber);--wash:var(--amber-soft)}svg .red{--tone:var(--red);--wash:var(--red-soft)}svg .purple{--tone:var(--purple);--wash:var(--purple-soft)}
svg text{fill:var(--ink)}svg .node{cursor:pointer;transition:opacity .18s}svg .node-bg{fill:var(--panel);stroke:var(--line);stroke-width:1.4}svg .accent{fill:var(--tone,var(--blue))}svg .node-title{font-size:18px;font-weight:720;letter-spacing:-.2px}svg .sub{font-size:14px;fill:var(--muted)}svg .tag{font-size:10px;letter-spacing:1px;font-weight:750;fill:var(--tone,var(--blue))}svg .lane{fill:var(--soft);stroke:var(--line);stroke-width:1}svg .lane-title{font-size:15px;font-weight:700;letter-spacing:.25px}svg .edge{fill:none;stroke:var(--tone,var(--blue));stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}svg .annotation{font-size:15px;font-weight:700;fill:var(--tone,var(--muted))}svg .selected .node-bg,svg .node:hover .node-bg{fill:var(--wash,var(--blue-soft));stroke:var(--tone,var(--blue));stroke-width:2.5}svg .node:focus{outline:none}svg .node:focus-visible .node-bg{stroke:var(--amber);stroke-width:4}svg .dim{opacity:.16}svg .large{font-size:44px;font-weight:750;letter-spacing:-1px}svg .rule{stroke:var(--line);stroke-width:1}svg .muted{fill:var(--muted)}svg .small{font-size:12px;fill:var(--muted)}svg .pill{fill:var(--wash,var(--soft));stroke:var(--tone,var(--line));stroke-width:1}svg .dot{fill:var(--tone,var(--blue))}
</style><defs><marker id="04-edition-publish-ack-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" style="fill:var(--muted)"/></marker></defs><text x="24" y="32" class="tag">HEMERA V2 · CLEYROP · 2 OCTOBRE 2026</text><text x="24" y="65" class="node-title" style="font-size:27px">Une édition avant chaque acquittement</text><text x="24" y="91" class="sub">Le moment décisif est la publication conditionnelle. Un veto, un conflit ou une réponse perdue ne doivent jamais être interprétés comme</text><text x="24" y="110" class="sub">une autorisation d’acquitter.</text><g transform="translate(0 125)"><rect class="lane" x="20" y="20" width="1160" height="280" rx="16"/><text class="lane-title" x="38" y="47">PRÉPARER EN PRIVÉ</text><text class="sub" x="38" y="68">Édition visible E42 · curseur 100 · ack source 100</text><rect class="lane" x="20" y="350" width="1160" height="280" rx="16"/><text class="lane-title" x="38" y="377">PUBLIER, PUIS ACQUITTER</text><text class="sub" x="38" y="398">La ligne de visibilité change une fois ; la source suit ensuite</text><path data-edge="p1" class="edge blue" d="M370 165 H438" marker-end="url(#04-edition-publish-ack-arrow)"/><path data-edge="p2" class="edge blue" d="M755 165 H818" marker-end="url(#04-edition-publish-ack-arrow)"/><path data-edge="p3" class="edge blue" d="M1000 225 V400 H725 V433" marker-end="url(#04-edition-publish-ack-arrow)"/><path data-edge="failure" class="edge red" d="M575 225 V326 H36 V495 H46" stroke-dasharray="7 5" marker-end="url(#04-edition-publish-ack-arrow)"/><g class="node blue"><rect class="node-bg" x="50" y="115" width="320" height="110" rx="12"/><rect class="accent" x="50" y="129" width="4" height="82" rx="2"/><text class="tag" x="68" y="134">E42 RESTE VISIBLE</text><text class="node-title" x="68" y="157">1 · Préparer</text><text class="sub" x="68" y="178">Plage, opération, tentative</text></g><g class="node blue"><rect class="node-bg" x="445" y="115" width="310" height="110" rx="12"/><rect class="accent" x="445" y="129" width="4" height="82" rx="2"/><text class="tag" x="463" y="134">SNAPSHOT PRIVÉ</text><text class="node-title" x="463" y="157">2 · Writer staging</text><text class="sub" x="463" y="178">Candidat E43 + origin.*</text></g><g class="node blue"><rect class="node-bg" x="825" y="115" width="320" height="110" rx="12"/><rect class="accent" x="825" y="129" width="4" height="82" rx="2"/><text class="tag" x="843" y="134">AUCUNE PUBLICATION</text><text class="node-title" x="843" y="157">3 · Auditer</text><text class="sub" x="843" y="178">Preuve liée au snapshot exact</text></g><g class="node red"><rect class="node-bg" x="50" y="440" width="320" height="110" rx="12"/><rect class="accent" x="50" y="454" width="4" height="82" rx="2"/><text class="tag" x="68" y="459">REFUS OU RÉCONCILIATION</text><text class="node-title" x="68" y="482">Veto / conflit</text><text class="sub" x="68" y="503">Aucune nouvelle édition</text></g><g class="node blue"><rect class="node-bg" x="620" y="440" width="250" height="110" rx="12"/><rect class="accent" x="620" y="454" width="4" height="82" rx="2"/><text class="tag" x="638" y="459">E43 DEVIENT VISIBLE</text><text class="node-title" x="638" y="482">4 · Publier</text><text class="sub" x="638" y="503">Préconditions + CAS</text></g><g class="node blue"><rect class="node-bg" x="910" y="440" width="240" height="110" rx="12"/><rect class="accent" x="910" y="454" width="4" height="82" rx="2"/><text class="tag" x="928" y="459">CHECKPOINT COUVERT</text><text class="node-title" x="928" y="482">5 · Ack source</text><text class="sub" x="928" y="503">Après preuve de publication</text></g><path data-edge="p5" class="edge blue" d="M870 495 H903" marker-end="url(#04-edition-publish-ack-arrow)"/><text class="annotation amber" x="50" y="674">RÉPONSE PERDUE ≠ COMMIT ÉCHOUÉ</text><text class="sub" x="50" y="695">Rechercher une publication approuvée ; un snapshot candidat ou un cache absent ne suffit pas.</text></g><text x="24" y="878" class="small">Simulation pédagogique du contrat cible · Ces animations ne sont pas des résultats de tests.</text></svg>