<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 915" data-theme="dark" role="img" aria-labelledby="08-preuves-risques-title 08-preuves-risques-desc"><title id="08-preuves-risques-title">Les preuves se lisent par contrat</title><desc id="08-preuves-risques-desc">Le banc apporte des résultats utiles et plusieurs refus nets. Il ne qualifie pas encore la plateforme cible : chaque contrat conserve ses limites et ses essais manquants. Familles de contrats, pas expériences indépendantes · Rouge : exigence en défaut dans le périmètre testé. Ambre : preuve partielle.</desc><style>:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--soft:#e9edf4;--ink:#20283c;--muted:#58657c;--line:#ced6e2;--blue:#285cd4;--blue-soft:#eaf0ff;--teal:#087b73;--teal-soft:#e2f5ef;--amber:#a85a0c;--amber-soft:#fff1df;--red:#b7314a;--red-soft:#fde9ef;--purple:#7749c3;--purple-soft:#f1eaff;--shadow:0 14px 35px #172e5510}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}
svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--panel)}
svg .blue{--tone:var(--blue);--wash:var(--blue-soft)}svg .teal{--tone:var(--teal);--wash:var(--teal-soft)}svg .amber{--tone:var(--amber);--wash:var(--amber-soft)}svg .red{--tone:var(--red);--wash:var(--red-soft)}svg .purple{--tone:var(--purple);--wash:var(--purple-soft)}
svg text{fill:var(--ink)}svg .node{cursor:pointer;transition:opacity .18s}svg .node-bg{fill:var(--panel);stroke:var(--line);stroke-width:1.4}svg .accent{fill:var(--tone,var(--blue))}svg .node-title{font-size:18px;font-weight:720;letter-spacing:-.2px}svg .sub{font-size:14px;fill:var(--muted)}svg .tag{font-size:10px;letter-spacing:1px;font-weight:750;fill:var(--tone,var(--blue))}svg .lane{fill:var(--soft);stroke:var(--line);stroke-width:1}svg .lane-title{font-size:15px;font-weight:700;letter-spacing:.25px}svg .edge{fill:none;stroke:var(--tone,var(--blue));stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}svg .annotation{font-size:15px;font-weight:700;fill:var(--tone,var(--muted))}svg .selected .node-bg,svg .node:hover .node-bg{fill:var(--wash,var(--blue-soft));stroke:var(--tone,var(--blue));stroke-width:2.5}svg .node:focus{outline:none}svg .node:focus-visible .node-bg{stroke:var(--amber);stroke-width:4}svg .dim{opacity:.16}svg .large{font-size:44px;font-weight:750;letter-spacing:-1px}svg .rule{stroke:var(--line);stroke-width:1}svg .muted{fill:var(--muted)}svg .small{font-size:12px;fill:var(--muted)}svg .pill{fill:var(--wash,var(--soft));stroke:var(--tone,var(--line));stroke-width:1}svg .dot{fill:var(--tone,var(--blue))}
</style><defs><marker id="08-preuves-risques-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" style="fill:var(--muted)"/></marker></defs><text x="24" y="32" class="tag">HEMERA V2 · CLEYROP · 2 OCTOBRE 2026</text><text x="24" y="65" class="node-title" style="font-size:27px">Les preuves se lisent par contrat</text><text x="24" y="91" class="sub">Le banc apporte des résultats utiles et plusieurs refus nets. Il ne qualifie pas encore la plateforme cible : chaque contrat conserve</text><text x="24" y="110" class="sub">ses limites et ses essais manquants.</text><g transform="translate(0 125)"><text class="annotation muted" x="43" y="45">33 entrées de registre, avec recouvrements</text><text class="sub" x="43" y="66">18 passed · 5 failed · 10 not_executed — aucun score de maturité</text><text class="annotation muted" x="43" y="96">CONTRAT</text><text class="sub" x="43" y="117"></text><text class="annotation muted" x="346" y="96">OBSERVATION LIMITÉE</text><text class="sub" x="346" y="117"></text><text class="annotation muted" x="776" y="96">PREUVE QUI MANQUE</text><text class="sub" x="776" y="117"></text><g class="node amber"><rect class="node-bg" x="25" y="112" width="1150" height="53" rx="8"/><rect class="accent" x="25" y="121" width="4" height="35" rx="2"/><text class="node-title" x="43" y="145">Publication WAP</text><text class="sub" x="346" y="145">CAS et staging après initialisation</text><text class="sub" x="776" y="145">Première table, zombie, crash / ack</text></g><g class="node red"><rect class="node-bg" x="25" y="173" width="1150" height="53" rx="8"/><rect class="accent" x="25" y="182" width="4" height="35" rx="2"/><text class="node-title" x="43" y="206">Confidentialité</text><text class="sub" x="346" y="206">Candidat non publié lisible</text><text class="sub" x="776" y="206">Fermer l’accès aux objets non publiés</text></g><g class="node red"><rect class="node-bg" x="25" y="234" width="1150" height="53" rx="8"/><rect class="accent" x="25" y="243" width="4" height="35" rx="2"/><text class="node-title" x="43" y="267">Expiration des droits</text><text class="sub" x="346" y="267">TTL natif Lakekeeper refusé</text><text class="sub" x="776" y="267">Intégrer modèle, contexte et caches</text></g><g class="node red"><rect class="node-bg" x="25" y="295" width="1150" height="53" rx="8"/><rect class="accent" x="25" y="304" width="4" height="35" rx="2"/><text class="node-title" x="43" y="328">Parité SQL</text><text class="sub" x="346" y="328">Valeurs et types divergent</text><text class="sub" x="776" y="328">Contrat sémantique des moteurs finaux</text></g><g class="node amber"><rect class="node-bg" x="25" y="356" width="1150" height="53" rx="8"/><rect class="accent" x="25" y="365" width="4" height="35" rx="2"/><text class="node-title" x="43" y="389">Exécution et clients</text><text class="sub" x="346" y="389">Sous-ensemble Spark transitoire</text><text class="sub" x="776" y="389">Clients, tenants et moteurs sans JVM</text></g><g class="node amber"><rect class="node-bg" x="25" y="417" width="1150" height="53" rx="8"/><rect class="accent" x="25" y="426" width="4" height="35" rx="2"/><text class="node-title" x="43" y="450">Schéma et lectures</text><text class="sub" x="346" y="450">Ajout nullable / refresh observés</text><text class="sub" x="776" y="450">Contraction, concurrence et Icegres</text></g><g class="node amber"><rect class="node-bg" x="25" y="478" width="1150" height="53" rx="8"/><rect class="accent" x="25" y="487" width="4" height="35" rx="2"/><text class="node-title" x="43" y="511">Livraison et leases</text><text class="sub" x="346" y="511">Complétion SQL obsolète refusée</text><text class="sub" x="776" y="511">Fencing destination et replay réel</text></g><g class="node amber"><rect class="node-bg" x="25" y="539" width="1150" height="53" rx="8"/><rect class="accent" x="25" y="548" width="4" height="35" rx="2"/><text class="node-title" x="43" y="572">Rétention et GC</text><text class="sub" x="346" y="572">Propriété de rétention persistée</text><text class="sub" x="776" y="572">Expiration et purge physique sûres</text></g><g class="node red"><rect class="node-bg" x="25" y="600" width="1150" height="53" rx="8"/><rect class="accent" x="25" y="609" width="4" height="35" rx="2"/><text class="node-title" x="43" y="633">Plan et compilation</text><text class="sub" x="346" y="633">Import, cache et contrat en défaut</text><text class="sub" x="776" y="633">Manifestes, fingerprints et wrappers</text></g><text class="annotation amber" x="43" y="707">À PART : PROTOTYPE</text><text class="sub" x="43" y="728">Démo + 10 tests existants verts ; 4 contre-exemples reproduits, 0 garantie produit acceptée.</text></g><text x="24" y="903" class="small">Familles de contrats, pas expériences indépendantes · Rouge : exigence en défaut dans le périmètre testé. Ambre : preuve partielle.</text></svg>