<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" data-theme="light" role="img" aria-labelledby="07-migration-decisions-title 07-migration-decisions-desc"><title id="07-migration-decisions-title">Migrer par preuves et par cohortes</title><desc id="07-migration-decisions-desc">Le chemin critique est la frontière d’édition. Les migrations d’identité, de journal et de calcul avancent en parallèle, puis se rejoignent sur une installation complète sans JVM. Dépendances de migration, sans calendrier estimé · Tous les gates de qualification cible ci-dessus restent ouverts.</desc><style>:root{color-scheme:light;--bg:#f4f5f8;--panel:#fff;--soft:#e9edf4;--ink:#20283c;--muted:#58657c;--line:#ced6e2;--blue:#285cd4;--blue-soft:#eaf0ff;--teal:#087b73;--teal-soft:#e2f5ef;--amber:#a85a0c;--amber-soft:#fff1df;--red:#b7314a;--red-soft:#fde9ef;--purple:#7749c3;--purple-soft:#f1eaff;--shadow:0 14px 35px #172e5510}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}}
:root[data-theme=dark]{color-scheme:dark;--bg:#111724;--panel:#192234;--soft:#202c42;--ink:#e3eaf6;--muted:#a5b3c9;--line:#34455e;--blue:#8aafff;--blue-soft:#243451;--teal:#66d6ba;--teal-soft:#173a38;--amber:#f0ba70;--amber-soft:#443326;--red:#ff99af;--red-soft:#43293b;--purple:#c3a5ff;--purple-soft:#352944;--shadow:none}
svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink);background:var(--panel)}
svg .blue{--tone:var(--blue);--wash:var(--blue-soft)}svg .teal{--tone:var(--teal);--wash:var(--teal-soft)}svg .amber{--tone:var(--amber);--wash:var(--amber-soft)}svg .red{--tone:var(--red);--wash:var(--red-soft)}svg .purple{--tone:var(--purple);--wash:var(--purple-soft)}
svg text{fill:var(--ink)}svg .node{cursor:pointer;transition:opacity .18s}svg .node-bg{fill:var(--panel);stroke:var(--line);stroke-width:1.4}svg .accent{fill:var(--tone,var(--blue))}svg .node-title{font-size:18px;font-weight:720;letter-spacing:-.2px}svg .sub{font-size:14px;fill:var(--muted)}svg .tag{font-size:10px;letter-spacing:1px;font-weight:750;fill:var(--tone,var(--blue))}svg .lane{fill:var(--soft);stroke:var(--line);stroke-width:1}svg .lane-title{font-size:15px;font-weight:700;letter-spacing:.25px}svg .edge{fill:none;stroke:var(--tone,var(--blue));stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}svg .annotation{font-size:15px;font-weight:700;fill:var(--tone,var(--muted))}svg .selected .node-bg,svg .node:hover .node-bg{fill:var(--wash,var(--blue-soft));stroke:var(--tone,var(--blue));stroke-width:2.5}svg .node:focus{outline:none}svg .node:focus-visible .node-bg{stroke:var(--amber);stroke-width:4}svg .dim{opacity:.16}svg .large{font-size:44px;font-weight:750;letter-spacing:-1px}svg .rule{stroke:var(--line);stroke-width:1}svg .muted{fill:var(--muted)}svg .small{font-size:12px;fill:var(--muted)}svg .pill{fill:var(--wash,var(--soft));stroke:var(--tone,var(--line));stroke-width:1}svg .dot{fill:var(--tone,var(--blue))}
</style><defs><marker id="07-migration-decisions-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 z" style="fill:var(--muted)"/></marker></defs><text x="24" y="32" class="tag">HEMERA V2 · CLEYROP · 2 OCTOBRE 2026</text><text x="24" y="65" class="node-title" style="font-size:27px">Migrer par preuves et par cohortes</text><text x="24" y="91" class="sub">Le chemin critique est la frontière d’édition. Les migrations d’identité, de journal et de calcul avancent en parallèle, puis se</text><text x="24" y="110" class="sub">rejoignent sur une installation complète sans JVM.</text><g transform="translate(0 125)"><rect class="lane" x="20" y="20" width="1160" height="160" rx="16"/><text class="lane-title" x="38" y="47">DÉCISIONS DÉJÀ FIXÉES</text><text class="sub" x="38" y="68">Les choix ouverts portent sur les mécanismes et les candidats, pas sur ces exigences</text><rect class="lane" x="20" y="210" width="1160" height="275" rx="16"/><text class="lane-title" x="38" y="237">CHEMIN CRITIQUE</text><text class="sub" x="38" y="258">Un gate se ferme par une preuve exécutée et conservée</text><rect class="lane" x="20" y="515" width="1160" height="185" rx="16"/><text class="lane-title" x="38" y="542">QUALIFICATIONS EN PARALLÈLE</text><text class="sub" x="38" y="563">Pas de calendrier annoncé avant mesure des écarts et des workloads</text><g class="node blue"><rect class="node-bg" x="45" y="90" width="1110" height="72" rx="12"/><rect class="accent" x="45" y="104" width="4" height="44" rx="2"/><text class="tag" x="63" y="109">DÉCIDÉ</text><text class="node-title" x="63" y="132">Zéro JVM · cores Rust · éditions autoritaires</text><text class="sub" x="63" y="153">WAP · publish-then-ack · journal durable · exécutants bornés</text></g><path data-edge="g1" class="edge blue" d="M282 370 H328" marker-end="url(#07-migration-decisions-arrow)"/><path data-edge="g2" class="edge blue" d="M572 370 H618" marker-end="url(#07-migration-decisions-arrow)"/><path data-edge="g3" class="edge blue" d="M862 370 H908" marker-end="url(#07-migration-decisions-arrow)"/><g class="node amber"><rect class="node-bg" x="45" y="305" width="237" height="122" rx="12"/><rect class="accent" x="45" y="319" width="4" height="94" rx="2"/><text class="tag" x="63" y="324">GATE OUVERT</text><text class="node-title" x="63" y="347">1 · Frontière d’édition</text><text class="sub" x="63" y="368">Writer / publisher / preuves</text><text class="sub" x="63" y="386">Confidentialité et reprise</text></g><g class="node amber"><rect class="node-bg" x="335" y="305" width="237" height="122" rx="12"/><rect class="accent" x="335" y="319" width="4" height="94" rx="2"/><text class="tag" x="353" y="324">APRÈS GATE 1</text><text class="node-title" x="353" y="347">2 · Premier EL réel</text><text class="sub" x="353" y="368">Source → raw → ack</text><text class="sub" x="353" y="386">C1–C4 corrigés, EL-1/2/3/6</text></g><g class="node amber"><rect class="node-bg" x="625" y="305" width="237" height="122" rx="12"/><rect class="accent" x="625" y="319" width="4" height="94" rx="2"/><text class="tag" x="643" y="324">PAR CONTRAT</text><text class="node-title" x="643" y="347">3 · Cohortes métier</text><text class="sub" x="643" y="368">Icegres, Eidos et services</text><text class="sub" x="643" y="386">API, données, droits, reprise</text></g><g class="node amber"><rect class="node-bg" x="915" y="305" width="237" height="122" rx="12"/><rect class="accent" x="915" y="319" width="4" height="94" rx="2"/><text class="tag" x="933" y="324">ACCEPTATION FINALE</text><text class="node-title" x="933" y="347">4 · Sortie JVM</text><text class="sub" x="933" y="368">Installation + exploitation</text><text class="sub" x="933" y="386">Restauration et workloads</text></g><g class="node amber"><rect class="node-bg" x="45" y="588" width="350" height="87" rx="12"/><rect class="accent" x="45" y="602" width="4" height="59" rx="2"/><text class="tag" x="63" y="607">CHOIX OUVERT</text><text class="node-title" x="63" y="630">Identité</text><text class="sub" x="63" y="651">OIDC, tenants, droits, TTL</text></g><g class="node amber"><rect class="node-bg" x="425" y="588" width="350" height="87" rx="12"/><rect class="accent" x="425" y="602" width="4" height="59" rx="2"/><text class="tag" x="443" y="607">CHOIX OUVERT</text><text class="node-title" x="443" y="630">Journal</text><text class="sub" x="443" y="651">Durabilité, replay, ack</text></g><g class="node amber"><rect class="node-bg" x="805" y="588" width="350" height="87" rx="12"/><rect class="accent" x="805" y="602" width="4" height="59" rx="2"/><text class="tag" x="823" y="607">CHOIX OUVERT</text><text class="node-title" x="823" y="630">Calcul distribué</text><text class="sub" x="823" y="651">SQL, mémoire, DML, erreurs</text></g></g><text x="24" y="868" class="small">Dépendances de migration, sans calendrier estimé · Tous les gates de qualification cible ci-dessus restent ouverts.</text></svg>