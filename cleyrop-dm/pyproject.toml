[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cleyrop-dm"
version = "0.1.0"
description = "Manage Cleyrop datasets (Apache Iceberg tables) with Python and SQL transformations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jean Humann" }]
dependencies = [
    "pyiceberg[sql-sqlite,pyarrow]>=0.9",
    "duckdb>=1.0",
    "sqlglot>=25",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
spark = ["pyspark[connect]>=3.5"]
dev = ["pytest>=8"]

[project.scripts]
cleyrop-dm = "cleyrop_dm.cli:main"

[tool.setuptools]
packages = ["cleyrop_dm", "cleyrop_dm.engines"]
